name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[claude,dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: End-to-end against fake Telegram (mock backend)
        run: python scripts/e2e_fake_telegram.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claw-telegram .
      - run: docker run --rm claw-telegram python -c "import claw_telegram"
